<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Account MatteDev: un solo accesso per tutte le app.">
  <title>Account · MatteDev</title>
  <link rel="stylesheet" href="./account.css">
</head>
<body>
  <main id="auth-screen" class="screen" hidden>
    <section class="card">
      <p id="app-hint" class="hint" hidden></p>
      <h1 id="auth-title">Bentornato</h1>
      <p id="auth-subtitle" class="sub">Accedi al tuo account MatteDev.</p>
      <div class="tabs" role="tablist" aria-label="Tipo di accesso">
        <button id="login-tab" class="tab active" type="button" role="tab" aria-selected="true" data-mode="login">Accedi</button>
        <button id="signup-tab" class="tab" type="button" role="tab" aria-selected="false" data-mode="signup">Registrati</button>
      </div>
      <form id="auth-form" class="form">
        <label id="username-field" class="label" hidden>Username
          <input name="username" type="text" autocomplete="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]{3,20}" placeholder="3-20 caratteri: lettere, numeri, _" autocapitalize="none" spellcheck="false">
        </label>
        <label class="label">Email
          <input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="nome@esempio.it">
        </label>
        <label class="label">Password
          <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="Almeno 8 caratteri">
        </label>
        <button id="auth-submit" class="submit" type="submit"><span>Accedi</span><span aria-hidden="true">→</span></button>
      </form>
      <p id="auth-error" class="msg error" hidden></p>
      <footer class="foot">
        <a href="https://privacy.mattedev.com/privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
        <a href="https://privacy.mattedev.com/terms.html" target="_blank" rel="noopener noreferrer">Termini di servizio</a>
      </footer>
    </section>
  </main>

  <main id="verify-screen" class="screen" hidden>
    <section class="card">
      <h1>Controlla la email</h1>
      <p class="sub">Link di verifica inviato a <strong id="verify-email"></strong>. Conferma per continuare.</p>
      <button id="check-verification" class="submit" type="button"><span>Ho verificato</span><span aria-hidden="true">→</span></button>
      <button id="resend-verification" class="link" type="button">Non hai ricevuto l'email? <strong>Reinvia</strong></button>
      <button id="verify-sign-out" class="link" type="button">Usa un altro account</button>
      <p id="verify-message" class="msg" hidden></p>
    </section>
  </main>

  <main id="done-screen" class="screen" hidden>
    <section class="card">
      <h1>Ciao, <span id="done-name"></span></h1>
      <p class="sub">Sei connesso a MatteDev. Apri una tua app per continuare.</p>
      <button id="done-sign-out" class="submit" type="button"><span>Esci</span><span aria-hidden="true">→</span></button>
    </section>
  </main>

  <div id="loading-screen" class="screen"><span class="loader"></span>Caricamento</div>
  <script type="module" src="./account.js?v=dashboard-redirect"></script>
</body>
</html>
